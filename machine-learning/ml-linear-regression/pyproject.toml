[project]
name = "ml-linear-regression"
version = "1.0.0"
description = "LinearRegression"
requires-python = ">=3.11"
authors = [
    { name = "Emanuel Cortez", email = "emanuelcortez32@gmail.com" }
]

dependencies = [
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "joblib==1.5.3",
    "skl2onnx==1.19.1",
    "ipykernel==7.1.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["."]


[tool.hatch.build.targets.wheel]
packages = ["."]