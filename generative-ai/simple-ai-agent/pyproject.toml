[project]
name = "simple-ai-agent"
version = "1.0.0"
description = "AI Agent API with FastAPI and LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.2.10",
    "langchain-community==0.3.31",
    "langchain-ollama==1.0.1",
    "fastapi[standard]==0.128.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest_env]

[tool.hatch.build.targets.wheel]
packages = ["src"]
