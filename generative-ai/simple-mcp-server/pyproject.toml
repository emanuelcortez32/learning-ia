[project]
name = "simple-mcp-server"
version = "1.0.0"
description = "MCP with MCPFast"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastmcp==3.2.4",
    "httpx==0.28.1",
    "jwt==1.3.1",
    "pydantic==2.12.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv==1.2.2",
    "termcolor==2.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest_env]

[tool.hatch.build.targets.wheel]
packages = ["src"]